name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runners default to PowerShell; one shell keeps one script.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Built on Apple silicon too: the macOS SDK carries both slices, and
          # Intel runners are the scarcest class in the queue.
          - target: x86_64-apple-darwin
            os: macos-latest
          # musl, so the Linux binaries are static and do not inherit the
          # runner's glibc version as a floor.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Everything except the Intel macOS build runs natively on its runner, so
      # it can be started here rather than shipped untried.
      - name: Check the binary starts
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          binary="target/${{ matrix.target }}/release/hl7probe"
          if [ "${{ runner.os }}" = "Windows" ]; then
            binary="${binary}.exe"
          fi
          file "$binary"
          "$binary" --version

      - name: Package
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          checksum() {
            if command -v shasum >/dev/null; then shasum -a 256 "$1"; else sha256sum "$1"; fi
          }

          version="${TAG#v}"
          name="hl7probe-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp README.md LICENSE "dist/${name}/"

          # Zip on Windows, tarball elsewhere, and record the bare file name so
          # a checksum can be verified wherever the archive is downloaded to.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/hl7probe.exe" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null && checksum "${name}.zip" | tee "${name}.zip.sha256")
          else
            cp "target/${{ matrix.target }}/release/hl7probe" "dist/${name}/"
            tar -czf "dist/${name}.tar.gz" -C dist "${name}"
            (cd dist && checksum "${name}.tar.gz" | tee "${name}.tar.gz.sha256")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG"
          else
            echo "Creating release $TAG"
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/*.sha256 --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
