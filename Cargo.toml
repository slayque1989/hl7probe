[package]
name = "hl7test"
version = "0.1.1"
edition = "2021"
description = "Inspect and validate HL7 v2 messages from the command line"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sudhi001/hl7probe"
homepage = "https://github.com/sudhi001/hl7probe"
documentation = "https://github.com/sudhi001/hl7probe#readme"
keywords = ["hl7", "healthcare", "interoperability", "cli", "validator"]
categories = ["command-line-utilities", "parser-implementations"]
rust-version = "1.74"
exclude = ["docs/", "examples/", ".github/"]

[[bin]]
name = "hl7test"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
ratatui = "0.29"
crossterm = "0.28"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
